<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenMessenger - Общайся с друзьями!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f0a;
            min-height: 100vh;
        }
        .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .auth-card {
            background: #0c120e;
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2ecc7144;
            text-align: center;
        }
        .auth-card h1 { color: #2ecc71; margin-bottom: 1rem; }
        .auth-card input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            background: #0a0f0c;
            border: 1px solid #1e2a22;
            border-radius: 1rem;
            color: #e0e0e0;
            font-size: 1rem;
        }
        .auth-card button {
            width: 100%;
            padding: 0.8rem;
            background: #2ecc71;
            color: #060a07;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .error-msg { color: #e74c3c; margin-top: 0.5rem; font-size: 0.85rem; }
        .success-msg { color: #2ecc71; margin-top: 0.5rem; font-size: 0.85rem; }
        
        .messenger {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        .header {
            background: #060a07;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2ecc7133;
            flex-wrap: wrap;
        }
        .header h2 { color: #2ecc71; font-size: 1.2rem; }
        .header-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .header-btn {
            background: #1a2a1f;
            border: 1px solid #2ecc7144;
            color: #2ecc71;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 300px;
            background: #0c120e;
            border-right: 1px solid #1e2a22;
            display: flex;
            flex-direction: column;
        }
        .profile {
            padding: 1rem;
            background: #0a0f0c;
            border-bottom: 1px solid #1e2a22;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .profile-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1a3a24, #0f281a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #2ecc71;
        }
        .profile-info { flex: 1; }
        .profile-name { font-weight: 600; color: #e0e0e0; font-size: 0.9rem; }
        .profile-username { font-size: 0.65rem; color: #2ecc71; }
        .search-box { padding: 0.8rem; border-bottom: 1px solid #1e2a22; }
        .search-box input {
            width: 100%;
            padding: 0.6rem;
            background: #0a0f0c;
            border: 1px solid #1e2a22;
            border-radius: 2rem;
            color: #e0e0e0;
        }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item {
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            border-bottom: 1px solid #162018;
        }
        .chat-item:hover { background: #122018; }
        .chat-item.active { background: #1a2a1f; border-left: 3px solid #2ecc71; }
        .chat-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1e3a2a, #0f2a1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2ecc71;
            font-size: 1.2rem;
        }
        .chat-info { flex: 1; }
        .chat-name { color: #d4d4d4; font-weight: 500; }
        .chat-last { font-size: 0.7rem; color: #6a8e7a; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0a100c; }
        .chat-header { padding: 1rem; background: #0c120e; border-bottom: 1px solid #1e2a22; }
        .chat-header-name { color: #e0e0e0; font-weight: 600; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .message { max-width: 70%; padding: 0.5rem 0.8rem; border-radius: 1rem; }
        .message.outgoing { background: #2ecc71; color: #060a07; align-self: flex-end; }
        .message.incoming { background: #1a241e; color: #d4d4d4; align-self: flex-start; border: 1px solid #2ecc7122; }
        .message-text { font-size: 0.85rem; }
        .message-time { font-size: 0.6rem; opacity: 0.7; margin-top: 0.2rem; text-align: right; }
        .input-area { padding: 1rem; background: #0c120e; display: flex; gap: 0.5rem; border-top: 1px solid #1e2a22; }
        .input-area input {
            flex: 1;
            padding: 0.7rem;
            background: #0a0f0c;
            border: 1px solid #1e2a22;
            border-radius: 2rem;
            color: #e0e0e0;
        }
        .input-area button { background: #2ecc71; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: #4a6a5a; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0c120e;
            border-radius: 1.5rem;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2ecc7144;
        }
        .modal-content h3 { color: #2ecc71; margin-bottom: 1rem; }
        .modal-content input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            background: #0a0f0c;
            border: 1px solid #1e2a22;
            border-radius: 1rem;
            color: #e0e0e0;
        }
        .modal-content button {
            width: 100%;
            padding: 0.7rem;
            background: #2ecc71;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }
        .result-box { margin-top: 1rem; padding: 0.8rem; background: #1a2a1f; border-radius: 1rem; text-align: center; }
        .friend-request {
            background: #1a2a1f;
            padding: 0.5rem;
            margin: 0.3rem 0;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .demo-users { margin-top: 1rem; padding: 0.8rem; background: #1a2a1f; border-radius: 1rem; font-size: 0.7rem; text-align: left; }
        .demo-users span { color: #2ecc71; }
        .badge { background: #2ecc71; color: #060a07; border-radius: 1rem; padding: 0.1rem 0.4rem; font-size: 0.6rem; margin-left: 0.3rem; }
    </style>
</head>
<body>

<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <h1>🌿 GreenMessenger</h1>
        <p style="color:#8aae9a; margin-bottom:1rem;">Введите номер +7</p>
        <input type="tel" id="phoneInput" placeholder="(999) 123-45-67">
        <button onclick="sendCode()">📲 Получить код</button>
        <div id="authMsg"></div>
        <div style="margin-top: 1rem; font-size: 0.8rem; color: #5a7e6a;">
            Код: <strong style="color:#2ecc71;">1488</strong>
        </div>
        <div class="demo-users">
            <div style="color:#2ecc71; margin-bottom:0.3rem;">📱 Демо-пользователи:</div>
            <div>• <span>@alex</span> — Алексей ( +7 999 123-45-67 )</div>
            <div>• <span>@maria</span> — Мария ( +7 999 234-56-78 )</div>
            <div>• <span>@dmitry</span> — Дмитрий ( +7 999 345-67-89 )</div>
        </div>
    </div>
</div>

<div id="messenger" class="messenger">
    <div class="header">
        <h2>🌿 GreenMessenger</h2>
        <div class="header-buttons">
            <button class="header-btn" onclick="showAddFriendModal()">➕ Добавить друга</button>
            <button class="header-btn" onclick="showFriendRequests()">📩 Заявки <span id="requestsBadge" class="badge" style="display:none;">0</span></button>
            <button class="header-btn" onclick="showProfile()">👤 Профиль</button>
            <button class="header-btn" onclick="logout()">🚪 Выйти</button>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="profile" id="profilePreview">
                <div class="profile-avatar" id="previewAvatar">👤</div>
                <div class="profile-info">
                    <div class="profile-name" id="previewName">Загрузка</div>
                    <div class="profile-username" id="previewUsername"></div>
                </div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="🔍 Поиск чатов..." id="searchChats" oninput="renderChats()">
            </div>
            <div class="chats-list" id="chatsList"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-header-name" id="chatHeaderName"></div>
            </div>
            <div class="messages" id="messagesContainer">
                <div class="empty-chat">💬 Выберите чат</div>
            </div>
            <div class="input-area" id="inputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">📤</button>
            </div>
        </div>
    </div>
</div>

<div id="addFriendModal" class="modal">
    <div class="modal-content">
        <h3>➕ Добавить друга</h3>
        <p style="color:#8aae9a; font-size:0.8rem;">Введите @username или номер</p>
        <input type="text" id="friendSearchInput" placeholder="@alex или +7 999 123-45-67">
        <button onclick="searchFriend()">🔍 Найти и отправить заявку</button>
        <button onclick="closeModal('addFriendModal')">Отмена</button>
        <div id="friendSearchResult"></div>
    </div>
</div>

<div id="requestsModal" class="modal">
    <div class="modal-content">
        <h3>📩 Заявки в друзья</h3>
        <div id="requestsList" style="max-height: 300px; overflow-y: auto;"></div>
        <button onclick="closeModal('requestsModal')">Закрыть</button>
    </div>
</div>

<script>
    // ========== ДАННЫЕ ==========
    const DEMO_USERS = [
        { id: "user1", phone: "+79991234567", username: "@alex", name: "Алексей Иванов" },
        { id: "user2", phone: "+79992345678", username: "@maria", name: "Мария Смирнова" },
        { id: "user3", phone: "+79993456789", username: "@dmitry", name: "Дмитрий Петров" }
    ];
    
    let users = JSON.parse(localStorage.getItem('green_users') || '[]');
    let currentUser = JSON.parse(localStorage.getItem('green_current_user') || 'null');
    let messages = JSON.parse(localStorage.getItem('green_messages') || '{}');
    let friends = JSON.parse(localStorage.getItem('green_friends') || '{}');
    let friendRequests = JSON.parse(localStorage.getItem('green_friend_requests') || '{}');
    
    DEMO_USERS.forEach(demo => {
        if (!users.find(u => u.phone === demo.phone)) users.push(demo);
    });
    localStorage.setItem('green_users', JSON.stringify(users));
    
    let currentChatId = null;
    let pendingPhone = null;
    
    function formatPhone(phone) {
        let d = phone.replace(/\D/g, '');
        if (d.length === 11 && d.startsWith('7')) {
            return `+7 (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9,11)}`;
        }
        return phone;
    }
    
    function validatePhone(raw) {
        let digits = raw.replace(/\D/g, '');
        if (digits.length === 10) digits = '7' + digits;
        if (!digits.startsWith('7') || digits.length !== 11) {
            return { valid: false, message: '❌ Номер должен быть +7 и 10 цифр' };
        }
        return { valid: true, normalized: '+7' + digits.substring(1) };
    }
    
    function findUserByQuery(query) {
        query = query.trim().toLowerCase();
        let username = query.startsWith('@') ? query : '@' + query;
        let user = users.find(u => u.username === username);
        if (user) return user;
        
        let digits = query.replace(/\D/g, '');
        if (digits.length === 10) digits = '7' + digits;
        if (digits.length === 11 && digits.startsWith('7')) {
            let phone = '+7' + digits.substring(1);
            return users.find(u => u.phone === phone);
        }
        return null;
    }
    
    function sendFriendRequest(toUserId, toUserName) {
        if (!currentUser) return;
        if (!friendRequests[toUserId]) friendRequests[toUserId] = [];
        if (friendRequests[toUserId].some(r => r.from === currentUser.id)) {
            alert('Вы уже отправили заявку этому пользователю!');
            return false;
        }
        friendRequests[toUserId].push({
            from: currentUser.id,
            fromName: currentUser.name,
            fromUsername: currentUser.username,
            time: new Date().toISOString()
        });
        localStorage.setItem('green_friend_requests', JSON.stringify(friendRequests));
        updateRequestsBadge();
        return true;
    }
    
    function acceptFriendRequest(fromUserId, fromName) {
        if (!currentUser) return;
        if (!friends[currentUser.id]) friends[currentUser.id] = [];
        if (!friends[fromUserId]) friends[fromUserId] = [];
        
        if (!friends[currentUser.id].includes(fromUserId)) {
            friends[currentUser.id].push(fromUserId);
        }
        if (!friends[fromUserId].includes(currentUser.id)) {
            friends[fromUserId].push(currentUser.id);
        }
        
        if (friendRequests[currentUser.id]) {
            friendRequests[currentUser.id] = friendRequests[currentUser.id].filter(r => r.from !== fromUserId);
        }
        
        localStorage.setItem('green_friends', JSON.stringify(friends));
        localStorage.setItem('green_friend_requests', JSON.stringify(friendRequests));
        
        updateRequestsBadge();
        renderChats();
        alert(`✅ ${fromName} теперь ваш друг!`);
    }
    
    function getFriendRequests() {
        if (!currentUser) return [];
        return friendRequests[currentUser.id] || [];
    }
    
    function updateRequestsBadge() {
        const count = getFriendRequests().length;
        const badge = document.getElementById('requestsBadge');
        if (count > 0) {
            badge.style.display = 'inline-block';
            badge.textContent = count;
        } else {
            badge.style.display = 'none';
        }
    }
    
    function showFriendRequests() {
        const requests = getFriendRequests();
        const container = document.getElementById('requestsList');
        
        if (requests.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#4a6a5a;padding:1rem;">Нет заявок в друзья</div>';
        } else {
            container.innerHTML = requests.map(req => `
                <div class="friend-request">
                    <div>
                        <div style="font-weight:600;">${escapeHtml(req.fromName)}</div>
                        <div style="font-size:0.7rem;color:#2ecc71;">${req.fromUsername || ''}</div>
                    </div>
                    <button onclick="acceptFriendRequest('${req.from}', '${escapeHtml(req.fromName)}')" style="background:#2ecc71; padding:0.3rem 0.8rem; margin:0;">✅ Принять</button>
                </div>
            `).join('');
        }
        document.getElementById('requestsModal').style.display = 'flex';
    }
    
    function getFriends() {
        if (!currentUser || !friends[currentUser.id]) return [];
        return friends[currentUser.id].map(id => users.find(u => u.id === id)).filter(u => u);
    }
    
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentChatId) return;
        
        const time = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        if (!messages[currentChatId]) messages[currentChatId] = [];
        
        messages[currentChatId].push({
            text: text,
            senderId: currentUser.id,
            time: time
        });
        
        localStorage.setItem('green_messages', JSON.stringify(messages));
        input.value = '';
        renderChats();
        openChat(currentChatId);
    }
    
    function openChat(chatId) {
        currentChatId = chatId;
        renderChats();
        
        const friendId = chatId.split('_')[1];
        const friend = users.find(u => u.id === friendId);
        
        if (friend) {
            document.getElementById('chatHeader').style.display = 'block';
            document.getElementById('chatHeaderName').innerHTML = friend.name;
            document.getElementById('inputArea').style.display = 'flex';
        }
        
        const msgs = messages[chatId] || [];
        const container = document.getElementById('messagesContainer');
        
        if (msgs.length === 0) {
            container.innerHTML = '<div class="empty-chat">✨ Напишите первое сообщение!</div>';
        } else {
            container.innerHTML = msgs.map(msg => `
                <div class="message ${msg.senderId === currentUser.id ? 'outgoing' : 'incoming'}">
                    <div class="message-text">${escapeHtml(msg.text)}</div>
                    <div class="message-time">${msg.time}</div>
                </div>
            `).join('');
        }
        container.scrollTop = container.scrollHeight;
        document.getElementById('messageInput').focus();
    }
    
    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!currentUser) return;
        
        const friendsList = getFriends();
        const searchTerm = document.getElementById('searchChats')?.value.toLowerCase() || '';
        
        const filtered = friendsList.filter(f => 
            f.name.toLowerCase().includes(searchTerm) || 
            (f.username && f.username.toLowerCase().includes(searchTerm))
        );
        
        if (filtered.length === 0) {
            container.innerHTML = '<div style="padding:1rem;text-align:center;color:#4a6a5a;">👋 Нет друзей. Нажмите "Добавить друга" и отправьте заявку @alex</div>';
            return;
        }
        
        container.innerHTML = filtered.map(friend => {
            const chatId = `chat_${friend.id}`;
            const msgs = messages[chatId] || [];
            const last = msgs[msgs.length - 1];
            return `
                <div class="chat-item ${currentChatId === chatId ? 'active' : ''}" onclick="openChat('${chatId}')">
                    <div class="chat-avatar">${friend.name.charAt(0)}</div>
                    <div class="chat-info">
                        <div class="chat-name">${escapeHtml(friend.name)}</div>
                        <div class="chat-last">${last ? escapeHtml(last.text.substring(0, 30)) : '💬 Новый чат'}</div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    
    function updateProfileUI() {
        if (!currentUser) return;
        document.getElementById('previewName').innerHTML = currentUser.name || currentUser.phone;
        document.getElementById('previewUsername').innerHTML = currentUser.username || '';
        document.getElementById('previewAvatar').innerHTML = (currentUser.name || 'U').charAt(0);
    }
    
    function showProfile() {
        alert(`🌿 Ваш профиль\n\nИмя: ${currentUser.name || 'Пользователь'}\nUsername: ${currentUser.username || 'Не установлен'}\nТелефон: ${formatPhone(currentUser.phone)}\nДрузей: ${getFriends().length}`);
    }
    
    function searchFriend() {
        const query = document.getElementById('friendSearchInput').value;
        const resultDiv = document.getElementById('friendSearchResult');
        
        if (!query) {
            resultDiv.innerHTML = '<div class="result-box" style="color:#e74c3c;">Введите @username или номер</div>';
            return;
        }
        
        const friend = findUserByQuery(query);
        
        if (!friend) {
            resultDiv.innerHTML = `<div class="result-box" style="color:#e74c3c;">❌ Пользователь не найден!<br>Попробуйте: @alex, @maria, @dmitry</div>`;
            return;
        }
        
        if (friend.id === currentUser.id) {
            resultDiv.innerHTML = '<div class="result-box" style="color:#e74c3c;">❌ Нельзя добавить самого себя!</div>';
            return;
        }
        
        const alreadyFriend = getFriends().some(f => f.id === friend.id);
        if (alreadyFriend) {
            resultDiv.innerHTML = '<div class="result-box" style="color:#f39c12;">⚠️ Этот друг уже у вас в списке!</div>';
            return;
        }
        
        resultDiv.innerHTML = `
            <div class="result-box">
                <div style="font-weight:600;">${escapeHtml(friend.name)}</div>
                <div style="font-size:0.7rem;color:#2ecc71;">${friend.username || friend.phone}</div>
                <button onclick="sendFriendRequestAndClose('${friend.id}', '${escapeHtml(friend.name)}')" style="margin-top:0.5rem;">📨 Отправить заявку</button>
            </div>
        `;
    }
    
    function sendFriendRequestAndClose(friendId, friendName) {
        sendFriendRequest(friendId, friendName);
        closeModal('addFriendModal');
        alert(`✅ Заявка отправлена ${friendName}! Когда он её примет, вы сможете общаться.`);
    }
    
    function showAddFriendModal() {
        document.getElementById('addFriendModal').style.display = 'flex';
        document.getElementById('friendSearchInput').value = '';
        document.getElementById('friendSearchResult').innerHTML = '';
    }
    
    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
    
    function logout() {
        currentUser = null;
        localStorage.removeItem('green_current_user');
        document.getElementById('messenger').style.display = 'none';
        document.getElementById('authScreen').style.display = 'flex';
    }
    
    function sendCode() {
        const raw = document.getElementById('phoneInput').value;
        const validation = validatePhone(raw);
        
        if (!validation.valid) {
            document.getElementById('authMsg').innerHTML = `<div class="error-msg">${validation.message}</div>`;
            return;
        }
        
        pendingPhone = validation.normalized;
        const code = prompt('Введите код подтверждения (код: 1488)');
        
        if (code === "1488") {
            let user = users.find(u => u.phone === pendingPhone);
            
            if (!user) {
                const usernameRaw = prompt('Придумайте @username (латиница, цифры, _)', 'user_' + pendingPhone.slice(-4));
                if (usernameRaw) {
                    const username = '@' + usernameRaw.replace(/[^a-zA-Z0-9_]/g, '');
                    user = {
                        id: Date.now().toString(),
                        phone: pendingPhone,
                        username: username,
                        name: 'Пользователь',
                        registeredAt: new Date().toISOString()
                    };
                    users.push(user);
                    localStorage.setItem('green_users', JSON.stringify(users));
                }
            }
            
            if (user) {
                currentUser = user;
                localStorage.setItem('green_current_user', JSON.stringify(currentUser));
                
                if (!friends[currentUser.id]) friends[currentUser.id] = [];
                if (!friendRequests[currentUser.id]) friendRequests[currentUser.id] = [];
                localStorage.setItem('green_friends', JSON.stringify(friends));
                localStorage.setItem('green_friend_requests', JSON.stringify(friendRequests));
                
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('messenger').style.display = 'flex';
                updateProfileUI();
                renderChats();
                updateRequestsBadge();
            }
        } else {
            document.getElementById('authMsg').innerHTML = `<div class="error-msg">❌ Неверный код! Нужно: 1488</div>`;
        }
    }
    
    if (currentUser) {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('messenger').style.display = 'flex';
        updateProfileUI();
        renderChats();
        updateRequestsBadge();
    }
    
    window.onclick = function(e) {
        if (e.target.classList.contains('modal')) e.target.style.display = 'none';
    }
</script>
</body>
</html>
